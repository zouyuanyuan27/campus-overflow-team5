# CampusOverflow 持续集成流水线（对应 T0-04 渐进式门禁 Sprint0）
name: CI
on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段1：全量编译（保证所有模块可以编译通过）
      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile

      # 阶段2：架构约束检查，只跑bootstrap架构测试模块
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap

      # 阶段3：单元测试，只跑指定模块，去掉 -am，不再递归拉别的业务模块
      - name: 单元测试
        run: mvn -B -f backend/pom.xml test -pl co-shared-kernel,co-identity/co-identity-domain,co-identity/co-identity-application,co-identity/co-identity-infrastructure,co-identity/co-identity-interfaces,co-identity/co-identity-api

      # 阶段4：覆盖率门禁
      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -pl co-shared-kernel,co-identity/co-identity-domain,co-identity/co-identity-application,co-identity/co-identity-infrastructure,co-identity/co-identity-interfaces,co-identity/co-identity-api -DskipITs -Djacoco.skip=false

      # 阶段5：集成测试，Sprint0允许失败
      - name: 集成测试
        continue-on-error: true
        run: mvn -B -f backend/pom.xml verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/site/jacoco/

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖 & 构建
        working-directory: frontend
        run: npm install && npm run build

  image-build:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: echo "build image"
